services:
  - type: web
    name: campus-anonymous-feedback-board
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /var/data/feedback.sqlite
      - key: CLIENT_ORIGIN
        value: '*'
    disk:
      name: feedback-data
      mountPath: /var/data
      sizeGB: 1